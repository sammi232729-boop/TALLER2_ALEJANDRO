<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Reserva</title>
    <link rel="stylesheet" href="ejercicio2-reserva.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <header>
                <span class="tag">EJERCICIO 2</span>
                <h1>Reserva una mesa</h1>
                <p>Elige la fecha y la hora.</p>
            </header>

            <form action="#" method="post" class="form">
                <div class="grid">
                    <div class="field">
                        <label for="fecha">Fecha <span class="required">*</span></label>
                        <input id="fecha" name="fecha" type="date" required>
                    </div>
                    <div class="field">
                        <label for="hora">Hora <span class="required">*</span></label>
                        <input id="hora" name="hora" type="time" required>
                    </div>
                </div>

                <div class="field">
                    <label for="personas">Número de personas <span class="required">*</span></label>
                    <input id="personas" name="personas" type="number" min="1" max="20" step="1" required>
                </div>

                <div class="field">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="5" maxlength="500" placeholder="Escribe algún comentario"></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="button primary">Confirmar reserva</button>
                    <button type="reset" class="button secondary">Limpiar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
