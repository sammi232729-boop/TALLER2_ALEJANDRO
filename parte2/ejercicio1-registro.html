<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Registro</title>
    <link rel="stylesheet" href="ejercicio1-registro.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <header>
                <span class="tag">EJERCICIO 1</span>
                <h1>Crear una cuenta</h1>
                <p>Completa los datos para registrarte.</p>
            </header>

            <form action="#" method="post" class="form">
                <div class="field">
                    <label for="nombre">Nombre <span class="required">*</span></label>
                    <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required>
                </div>

                <div class="field">
                    <label for="correo">Correo electrónico <span class="required">*</span></label>
                    <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña <span class="required">*</span></label>
                    <input id="password" name="password" type="password" minlength="8" aria-describedby="password-help" required>
                    <small id="password-help">Mínimo 8 caracteres.</small>
                </div>

                <label class="check">
                    <input type="checkbox" name="terminos" required>
                    <span>Acepto los términos y condiciones.</span>
                </label>

                <div class="actions">
                    <button type="submit" class="button primary">Registrarme</button>
                    <button type="reset" class="button secondary">Limpiar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
