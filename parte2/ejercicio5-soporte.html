<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Soporte</title>
    <link rel="stylesheet" href="ejercicio5-soporte.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <header>
                <span class="tag">EJERCICIO 5</span>
                <h1>Solicitud de soporte</h1>
                <p>Escribe el problema para poder ayudarte.</p>
            </header>

            <form action="#" method="post" enctype="multipart/form-data" class="form">
                <div class="field">
                    <label for="prioridad">Prioridad <span class="required">*</span></label>
                    <select id="prioridad" name="prioridad" required>
                        <option value="" selected disabled>Selecciona una prioridad</option>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>

                <div class="field">
                    <label for="problema">Describe el problema <span class="required">*</span></label>
                    <textarea id="problema" name="problema" rows="7" maxlength="1000" placeholder="Explica qué ocurre..." aria-describedby="problema-help" required></textarea>
                    <small id="problema-help">Máximo 1000 caracteres.</small>
                </div>

                <div class="field">
                    <label for="archivo">Archivo</label>
                    <input id="archivo" name="archivo" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" aria-describedby="archivo-help">
                    <small id="archivo-help">Puedes adjuntar una captura.</small>
                </div>

                <div class="actions">
                    <button type="submit" class="button primary">Crear ticket</button>
                    <button type="reset" class="button secondary">Limpiar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
