<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Solicitud laboral</title>
    <link rel="stylesheet" href="ejercicio4-solicitud-laboral.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <header>
                <span class="tag">EJERCICIO 4</span>
                <h1>Solicitud laboral</h1>
                <p>Ingresa tus datos y adjunta tu hoja de vida.</p>
            </header>

            <form action="#" method="post" enctype="multipart/form-data" class="form">
                <div class="grid">
                    <div class="field">
                        <label for="nombre">Nombre <span class="required">*</span></label>
                        <input id="nombre" name="nombre" type="text" required>
                    </div>
                    <div class="field">
                        <label for="apellido">Apellido <span class="required">*</span></label>
                        <input id="apellido" name="apellido" type="text" required>
                    </div>
                </div>

                <div class="field">
                    <label for="correo">Correo <span class="required">*</span></label>
                    <input id="correo" name="correo" type="email" required>
                </div>

                <div class="field">
                    <label for="cargo">Cargo de interés <span class="required">*</span></label>
                    <select id="cargo" name="cargo" required>
                        <option value="" selected disabled>Seleccione un cargo</option>
                        <option value="desarrollo">Desarrollo</option>
                        <option value="soporte">Soporte</option>
                        <option value="seguridad">Ciberseguridad</option>
                    </select>
                </div>

                <div class="field">
                    <label for="cv">Hoja de vida <span class="required">*</span></label>
                    <input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx" aria-describedby="cv-help" required>
                    <small id="cv-help">PDF, DOC o DOCX.</small>
                </div>

                <label class="check">
                    <input type="checkbox" name="datos" required>
                    <span>Autorizo el tratamiento de mis datos.</span>
                </label>

                <div class="actions">
                    <button type="submit" class="button primary">Enviar</button>
                    <button type="reset" class="button secondary">Limpiar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
